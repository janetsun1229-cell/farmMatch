  header {
    display: grid;
    grid-template-columns: auto 1fr 72px;
    align-items: center;
    padding: 10px 12px 4px;
  }
  h1 {
    margin: 0 auto;
    text-align: center;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: #fff;
    background: #5c3a1e;
    border-radius: 14px;
    padding: 6px 16px 7px;
    border: 3px solid #3d2914;
    box-shadow: 0 4px 0 #2a180c, inset 0 2px 0 rgba(255,220,160,.28);
    text-shadow: 0 2px 0 #1a0c04, 0 -1px 0 rgba(255,255,255,.15), 0 0 4px rgba(0,0,0,.4);
    max-width: max-content;
  }
  .hdr-left { display: flex; gap: 6px; justify-self: start; }
  #retry, #hdr-home {
    background: linear-gradient(#ffe9b8, #f0c878 55%, #e0a84a);
    border: 3px solid #6b4423;
    border-radius: 14px;
    padding: 7px 12px 6px;
    font-weight: 800;
    color: #3d2914;
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
    box-shadow: 0 5px 0 #8a5a28, 0 8px 12px rgba(60,30,0,.22), inset 0 3px 0 rgba(255,255,255,.75);
  }
  #retry:active, #hdr-home:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #8a5a28, 0 4px 8px rgba(60,30,0,.18), inset 0 2px 0 rgba(255,255,255,.65);
  }
  #board-wrap { flex: 1; display: flex; align-items: safe center; justify-content: safe center; min-height: 0; padding: 4px 8px; overflow-x: hidden; overflow-y: auto; }
  #board { position: relative; }
  .tile {
    position: absolute;
    border: 1px solid #cbb992;
    border-radius: 10px;
    background: linear-gradient(#fffaf0, #ffe9c4);
    padding: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transform: rotate(var(--rot, 0deg));
  }
  .tile img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .tile.wool { background: linear-gradient(#e9f8d8, #d7efc4); }
  .tile.covered { pointer-events: none; }
  .tile.free {
    cursor: pointer;
    border: 2px solid #e8c76a;
    box-shadow:
      0 0 0 2px rgba(255, 220, 120, .55),
      0 7px 0 #b89252,
      0 12px 16px rgba(70, 40, 10, .28),
      inset 0 2px 0 rgba(255,255,255,.9);
  }
  .tile.free:active {
    transform: translateY(4px) scale(0.92) rotate(var(--rot, 0deg));
    box-shadow:
      0 0 0 2px rgba(255, 220, 120, .4),
      0 2px 0 #b89252,
      0 4px 8px rgba(70, 40, 10, .2),
      inset 0 2px 0 rgba(255,255,255,.7);
  }
  .tile.dim::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 7px;
    background: rgba(42, 32, 14, var(--shade));
    pointer-events: none;
  }
  #dock { padding: 0 12px 12px; }
  #hold { min-height: 0; display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
  #hold:empty { display: none; }
  .hold {
    width: 46px; height: 46px; padding: 0;
    border: 1px solid #cbb992; border-radius: 10px; background: #fff6e4;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .hold img { width: 86%; height: 86%; object-fit: contain; }
  .hold.wool { background: #d7efc4; }
  #tray {
    height: 74px;
    background: linear-gradient(#d4924a, #b87434);
    border: 4px solid #7a4a22;
    border-radius: 10px 10px 18px 18px;
    box-shadow: inset 0 2px 0 rgba(239,192,122,.55), 0 4px 0 #6a3e18;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    padding: 3px 8px 4px;
    align-items: stretch;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  #tray.warn {
    background: linear-gradient(#f09840, #e06818);
    border-color: #c45a10;
    box-shadow: inset 0 2px 0 rgba(255,208,138,.55), 0 4px 0 #a04810;
    animation: trayWarnPulse 0.9s ease 2;
  }
  @keyframes trayWarnPulse {
    0%, 100% { filter: brightness(1); }
    40% { filter: brightness(1.35); box-shadow: inset 0 2px 0 rgba(255,224,160,.7), 0 4px 0 #a04810, 0 0 14px rgba(255,140,40,.65); }
  }
  .slot.pop { overflow: visible; z-index: 5; }
  .slot.pop img { animation: matchPop 0.35s ease forwards; }
  .slot.land { animation: slotLand 0.22s ease; }
  @keyframes matchPop {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    35% { transform: translate(var(--mx, 0), var(--my, -18px)) scale(1.4); opacity: 1; }
    100% { transform: translate(var(--mx, 0), var(--my, -18px)) scale(0.15); opacity: 0; }
  }
  @keyframes slotLand {
    0% { transform: scale(1); }
    45% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .fly-card {
    position: fixed;
    z-index: 40;
    border: 1px solid #cbb992;
    border-radius: 10px;
    background: linear-gradient(#fffaf0, #ffe9c4);
    padding: 7px;
    box-shadow: 0 8px 16px rgba(40,20,0,.28), inset 0 2px 0 rgba(255,255,255,.9);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 0.22s cubic-bezier(.2,.8,.2,1), left 0.22s cubic-bezier(.2,.8,.2,1), top 0.22s cubic-bezier(.2,.8,.2,1);
  }
  .fly-card img { width: 100%; height: 100%; object-fit: contain; }
  .burst {
    position: fixed;
    z-index: 41;
    pointer-events: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: burstOut 0.35s ease-out forwards;
  }
  .burst.star {
    width: 0; height: 0;
    border-radius: 0;
    background: transparent !important;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 9px solid var(--burst, #ffd84a);
  }
  @keyframes burstOut {
    0% { transform: translate(0,0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--bx), var(--by)) scale(1.1); opacity: 0; }
  }
  #powers button.flash {
    animation: powerFlash 0.7s ease 1;
  }
  @keyframes powerFlash {
    0%, 100% { filter: brightness(1); transform: scale(1); }
    35% { filter: brightness(1.35); transform: scale(1.08); }
    70% { filter: brightness(1.15); transform: scale(1.04); }
  }
  .slot {
    border-radius: 8px;
    background: rgba(72, 38, 12, 0.42);
    min-height: 0;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .slot { overflow: hidden; } .slot img { width: 86%; height: 86%; object-fit: contain; }
  .slot.wool { background: #d7efc4; }
  #powers { display: flex; justify-content: center; gap: 10px; margin-top: 10px; min-height: 58px; }
  #powers button {
    position: relative;
    min-width: 96px;
    background: linear-gradient(#7ec4ff, #2f86ef 55%, #1f6fd4);
    color: white;
    border: 3px solid #1a4f9a;
    border-radius: 16px;
    padding: 10px 14px 8px;
    font-weight: 800;
    font-size: 16px;
    text-shadow: 0 1px 0 #134a8c;
    box-shadow: 0 6px 0 #143f7a, 0 10px 14px rgba(10,40,90,.28), inset 0 3px 0 rgba(255,255,255,.55);
  }
  #powers button span {
    display: block;
    font-size: 12px;
    font-weight: 700;
    opacity: 0.95;
  }
  #powers button:disabled {
    background: linear-gradient(#d2c0a0, #b89a72 55%, #9a7a52);
    color: #6b5340;
    border-color: #6b5340;
    box-shadow: 0 4px 0 #5a4030, inset 0 2px 0 rgba(255,255,255,.25);
    text-shadow: none;
  }
  #powers button.locked {
    background: linear-gradient(#cbb892, #a89068 55%, #8a7048);
    color: #5a4430;
    border-color: #5a4430;
    box-shadow: 0 4px 0 #4a3420, inset 0 2px 0 rgba(255,255,255,.2);
    text-shadow: none;
  }
  #powers button.locked .lock {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 26px;
    height: 26px;
    pointer-events: none;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.35));
  }
  #powers button:not(.locked) span:not(.lv) {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.05;
    color: #fff;
    text-shadow: 0 2px 0 #134a8c;
  }
  #powers button.hint::after {
    content: "👆";
    position: absolute;
    right: -6px;
    bottom: -18px;
    font-size: 26px;
    animation: poke 0.9s ease-in-out infinite;
  }
  @keyframes poke { 50% { transform: translateY(6px); } }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(36, 36, 40, 0.58);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  #overlay[hidden] { display: none; }
  #panel {
    position: relative;
    z-index: 1;
    background: linear-gradient(#fff4dc, #f5e2b8);
    border: 6px solid #5c3a1e;
    border-radius: 20px;
    padding: 22px 28px;
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #3d2914;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.38), inset 0 3px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(90,50,20,.12);
  }
  #panel button {
    margin-top: 12px;
    background: #3d8ef0;
    color: white;
    border: 3px solid #1d4f93;
    border-radius: 14px;
    padding: 8px 16px;
    font-weight: 800;
    font-size: 16px;
  }
  #panel .choices #again {
    background: linear-gradient(#8ef06a, #3ec848 55%, #22a832);
    color: #fff;
    border: 3px solid #147a28;
    box-shadow: 0 5px 0 #0e5a1c, 0 8px 12px rgba(0,40,0,.25), inset 0 2px 0 rgba(255,255,255,.65);
    text-shadow: 0 1px 0 #0e5a1c;
  }
  #panel .choices #to-home {
    background: linear-gradient(#fff6df, #f0d9a0 55%, #e8c878);
    color: #3d2914;
    border: 3px solid #6b4423;
    box-shadow: 0 5px 0 #8a5a28, 0 8px 12px rgba(60,30,0,.22), inset 0 2px 0 rgba(255,255,255,.8);
  }
  #next {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 5;
    background: #3d8ef0;
    color: white;
    border: 3px solid #1d4f93;
    border-radius: 16px;
    padding: 12px 16px;
    font-weight: 800;
    font-size: 16px;
    box-shadow: 0 3px 0 #1d4f93;
  }
  #next[hidden] { display: none; }
  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
  .strip {
    position: absolute; top: -36px; width: 14px; height: 26px;
    border-radius: 3px;
    animation: fall 1.65s linear forwards;
  }
  @keyframes fall {
    0% { transform: translate3d(0,0,0) rotate(0deg); }
    25% { transform: translate3d(var(--swing), 26vh, 0) rotate(160deg); }
    50% { transform: translate3d(calc(var(--swing) * -1.15), 52vh, 0) rotate(320deg); }
    75% { transform: translate3d(var(--swing), 78vh, 0) rotate(480deg); }
    100% { transform: translate3d(calc(var(--swing) * -0.5), 108vh, 0) rotate(640deg); opacity: 0.92; }
  }
  .burst.spark {
    width: 18px; height: 18px; border-radius: 0; background: transparent !important;
    background-image: url("ui-upgrade/star-spark.png") !important;
    background-size: contain !important;
    background-repeat: no-repeat !important;
  }

  #panel .choices { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  #panel .choices button { margin-top: 0; font-size: 20px; padding: 12px 16px; }
  button { font-family: inherit; cursor: pointer; }

  body.on-home header,
  body.on-home #board-wrap,
  body.on-home #dock { display: none; }
  #home {
    display: none;
    position: relative;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px 36px;
    overflow: hidden;
  }
  body.on-home #home { display: flex; }
  #home-logo {
    width: min(92vw, 420px);
    height: auto;
    margin-top: 8px;
    filter: drop-shadow(0 10px 18px rgba(0,40,0,.28));
    z-index: 2;
  }
  #home-farmer {
    position: absolute;
    left: -18px;
    bottom: 118px;
    width: min(52vw, 220px);
    height: auto;
    transform-origin: 50% 100%;
    animation: farmerSway 2.8s ease-in-out infinite;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.22));
    z-index: 1;
    pointer-events: none;
  }
  @keyframes farmerSway {
    0%, 100% { transform: rotate(-2.4deg) translateX(0); }
    50% { transform: rotate(2.8deg) translateX(4px); }
  }
  #home-play {
    position: relative;
    z-index: 3;
    width: 132px;
    height: 132px;
    border: 0;
    border-radius: 28px;
    margin-bottom: 10px;
    font-size: 64px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 3px 0 #146b28;
    background: radial-gradient(circle at 30% 24%, #f3ffb0 0%, #7cf25a 28%, #2fd048 62%, #12a032 100%);
    box-shadow: 0 10px 0 #0a6a20, 0 16px 22px rgba(0,40,0,.32), inset 0 5px 0 rgba(255,255,255,.88), inset 0 -4px 0 rgba(0,80,20,.18);
  }
  #home-play:active { transform: translateY(4px); box-shadow: 0 6px 0 #0a6a20, 0 10px 14px rgba(0,40,0,.28), inset 0 4px 0 rgba(255,255,255,.8); }

  #home-cleared {
    display: none;
    margin: 4px 0 0;
    z-index: 2;
    width: min(70vw, 260px);
    height: auto;
    filter: drop-shadow(0 4px 6px rgba(0,40,0,.3));
  }
  body.cleared #home-cleared { display: block; }
  #mute {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 4;
    width: 52px;
    height: 52px;
    padding: 0;
    border: 0;
    border-radius: 16px;
    background: transparent;
    box-shadow: none;
    overflow: hidden;
  }
  #mute img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  #tip {
    position: fixed;
    z-index: 45;
    pointer-events: none;
    width: 56px;
    height: 56px;
    margin: 0;
    transform: translate(-50%, 8px);
    animation: tipBounce 0.9s ease-in-out infinite;
  }
  #tip[hidden] { display: none; }
  #tip .hand {
    width: 56px;
    height: 56px;
    object-fit: contain;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.25));
  }
  @keyframes tipBounce {
    0%, 100% { transform: translate(-50%, 8px); }
    50% { transform: translate(-50%, -6px); }
  }
  #powers button .lv {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 800;
    color: #6b4423;
    opacity: 0.85;
  }
  body.input-lock #board .tile,
  body.input-lock #hold button,
  body.input-lock #powers button { pointer-events: none; }

</style>
</head>
<body>
<div id="home">
  <button id="mute" type="button" aria-label="Mute"><img src="ui-upgrade/mute-on.png" alt=""></button>
  <img id="home-logo" src="home-title.png" alt="Farm Match">
  <img id="home-cleared" src="ui-upgrade/cleared-badge.png" alt="Cleared">
  <img id="home-farmer" src="home-farmer.png" alt="">
  <button id="home-play" type="button"><span id="home-level">1</span></button>
</div>
<header>
  <div class="hdr-left">
    <button id="retry" type="button">Retry</button>
    <button id="hdr-home" type="button">Home</button>
  </div>
  <h1 id="title">Level 1</h1>
  <span></span>
</header>
<div id="board-wrap"><div id="board"></div></div>
<div id="dock">
  <div id="hold"></div>
  <div id="tray"></div>
  <div id="powers"></div>
</div>
<div id="tip" hidden><img class="hand" src="ui-upgrade/tip-hand.png" alt=""></div>
<div id="overlay" hidden><div id="panel"></div></div>
<div id="confetti"></div>
<button id="next" type="button" hidden>Next</button>

    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function shift(ratio) {
    return Math.round(CARD * (1 - Math.sqrt(ratio)) * 1000) / 1000;
  }

  function gridOf(rows) {
    return rows.map((row, i) => ({ c: row[0], r: row[1], layer: i }));
  }

  function spec(level) {
    if (level < 1 || level > 50) throw new Error("bad level");
    if (level === 1) return { types: 4, count: 6, layers: gridOf([[4, 3], [4, 2], [2, 2]]) };
    if (level === 2) return { types: 4, count: 6, layers: gridOf([[4, 3], [4, 3]]) };
    if (level <= 5) return { types: 4, count: 6, layers: gridOf([[3, 2], [3, 2], [2, 2]]) };
    if (level <= 10) return { types: 6, count: 6, layers: gridOf([[5, 2], [5, 2], [4, 2]]) };
    if (level <= 15) return { types: 8, count: 6, layers: gridOf([[4, 3], [4, 3], [3, 3]]) };
    if (level <= 25) return { types: 10, count: 6, layers: gridOf([[5, 3], [5, 3], [5, 3]]) };
    if (level <= 40) return { types: 12, count: 6, layers: gridOf([[4, 4], [4, 3], [4, 3], [4, 2]]) };
    return { types: 15, count: 6, layers: gridOf([[5, 4], [5, 3], [4, 3], [4, 2]]) };
  }

  function stackPlan(level) {
    if (level <= 2) return { piles: 0, thick: 0 };
    if (level <= 10) return { piles: 2, thick: 4 };
    if (level <= 25) return { piles: 3, thick: 5 };
    if (level <= 40) return { piles: 4, thick: 6 };
    return { piles: 5, thick: 7 };
  }

  function overlaps(a, b) {
    const iw = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const ih = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    // Any visible bite blocks the lower card.
    return iw > 0.02 && ih > 0.02;
  }

  function isCovered(card, cards) {
    for (const other of cards) {
      if (other.layer > card.layer && overlaps(card, other)) return true;
    }
    return false;
  }

  function freeCards(cards) {
    return cards.filter((card) => !isCovered(card, cards));
  }

  function pileSlide() {
    return CARD / 10;
  }

  function addPile(cards, n, x, yTop) {
    const slide = pileSlide();
    for (let i = 0; i < n; i++) {
      const down = n - 1 - i;
      cards.push({
        x: x + down * slide,
        y: yTop + down * slide,
        w: CARD,
        h: CARD,
        layer: 20 + i,
        pile: true,
        rot: 0,
      });
    }
  }

  function pileBox(spot, thick) {
    const slide = pileSlide();
    const extra = (thick - 1) * slide;
    return { x: spot.x, y: spot.y, w: CARD + extra, h: CARD + extra };
  }

  function boxesHit(a, b) {
    const iw = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const ih = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return iw > 0.02 && ih > 0.02;
  }

  function nudgeField(cards, level, bump) {
    const rand = rng(level * 6271 + 29 + (bump || 0) * 7919);
    const px = rand() * Math.PI * 2;
    const py = rand() * Math.PI * 2;
    const ax = CARD * 0.25;
    const ay = CARD * 0.2;
    for (const card of cards) {
      if (card.pile) continue;
      card.x += ax * Math.sin(card.x * 0.2 + px);
      card.y += ay * Math.sin(card.y * 0.22 + py);
    }
  }

  function placePiles(cards, level, n, thick) {
    if (!n) return;
    const rand = rng(level * 9176 + 13);
    const extra = (thick - 1) * pileSlide();
    const pileW = CARD + extra;
    const pileH = CARD + extra;
    const minX = Math.min(...cards.map((card) => card.x));
    const minY = Math.min(...cards.map((card) => card.y));
    const maxX = Math.max(...cards.map((card) => card.x + card.w));
    const maxY = Math.max(...cards.map((card) => card.y + card.h));
    let overlap = CARD * 0.5;
    function band() {
      let left = minX + overlap - pileW;
      let xMax = maxX - overlap - pileW;
      if (xMax < left) {
        left = (minX + maxX) / 2 - pileW / 2;
        xMax = left;
      }
      const room = Math.max(0, xMax - left);
      const cap = Math.max(1, Math.floor((room + pileW + 0.001) / pileW));
      return { left, room, cap };
    }
    let fit = band();
    if (n > fit.cap * 2) {
      overlap = 0;
      fit = band();
    }
    if (n > fit.cap * 2) {
      overlap = -CARD * 0.2;
      fit = band();
    }
    let topN = 0;
    for (let i = 0; i < n; i++) if (rand() < 0.5) topN += 1;
    let botN = n - topN;
    while (topN > fit.cap && botN < fit.cap) { topN -= 1; botN += 1; }
    while (botN > fit.cap && topN < fit.cap) { botN -= 1; topN += 1; }
    if (topN > fit.cap || botN > fit.cap) {
      topN = Math.min(fit.cap, Math.ceil(n / 2));
      botN = n - topN;
      if (botN > fit.cap) { botN = fit.cap; topN = n - botN; }
    }
    function row(count, yBase, outward) {
      if (!count) return;
      const slack = Math.max(0, fit.room - (count - 1) * pileW);
      const weights = [];
      let sum = 0;
      for (let i = 0; i < count + 1; i++) {
        const w = 0.25 + rand();
        weights.push(w);
        sum += w;
      }
      let x = fit.left;
      for (let i = 0; i < count; i++) {
        x += slack * (weights[i] / sum);
        const y = yBase + outward * rand() * CARD * 0.1;
        addPile(cards, thick, x, y);
        x += pileW;
      }
    }
    row(topN, minY - pileH, -1);
    row(botN, maxY, 1);
  }

  function staggerBand(level) {
    if (level <= 2) return { maxX: 0.08, maxY: 0.06, progress: 0 };
    if (level <= 10) {
      const progress = (level - 3) / 7;
      return { maxX: 0.18 + progress * 0.07, maxY: 0.12 + progress * 0.08, progress };
    }
    if (level <= 25) {
      const progress = (level - 11) / 14;
      return { maxX: 0.26 + progress * 0.07, maxY: 0.18 + progress * 0.07, progress };
    }
    const progress = (level - 26) / 24;
    return { maxX: 0.32 + progress * 0.08, maxY: 0.24 + progress * 0.09, progress };
  }

  function staggerLayers(level, grids, bump) {
    const rand = rng(level * 503 + 11 + (bump || 0) * 9973);
    const band = staggerBand(level);
    const layers = spec(level).layers;
    const neat = level <= 2;
    const sx = rand() < 0.5 ? -1 : 1;
    const sy = rand() < 0.5 ? -1 : 1;
    for (let li = 1; li < grids.length; li++) {
      const upper = grids[li];
      const lower = grids[li - 1];
      const below = layers[li - 1];
      const startC = Math.floor((below.c - layers[li].c) / 2);
      const startR = Math.floor((below.r - layers[li].r) / 2);
      for (const card of upper) {
        const pc = startC + card.col;
        const pr = startR + card.row;
        const parent = lower[pr * below.c + pc];
        if (neat) {
          const ox = sx * CARD * (0.14 + rand() * 0.04);
          const oy = sy * CARD * (0.1 + rand() * 0.03);
          card.x = parent.x + ox;
          card.y = parent.y + oy;
          card.rot = 0;
          continue;
        }
        const easy = level === 5 || level === 8 || level === 12;
        const shrink = easy ? 0.72 : 1;
        const dx = (rand() * 2 - 1) * CARD * band.maxX * shrink;
        const dy = (rand() * 2 - 1) * CARD * band.maxY * shrink;
        // Keep parent cover about a quarter to two-fifths.
        let ox = dx / CARD;
        let oy = dy / CARD;
        let cover = (1 - Math.abs(ox)) * (1 - Math.abs(oy));
        if (cover < 0.26) {
          const scale = Math.sqrt(0.3 / Math.max(0.08, cover));
          ox /= scale;
          oy /= scale;
        }
        if (cover > 0.42) {
          const bump = 0.34 / cover;
          // push a bit more offset toward the band max
          const extra = 1 + (1 - bump) * 0.35;
          ox *= extra;
          oy *= extra;
          const limX = band.maxX * shrink;
          const limY = band.maxY * shrink;
          if (Math.abs(ox) > limX) ox = Math.sign(ox) * limX;
          if (Math.abs(oy) > limY) oy = Math.sign(oy) * limY;
        }
        card.x = parent.x + ox * CARD;
        card.y = parent.y + oy * CARD;
        card.rot = 0;
      }
    }
  }

  function tightenGaps(cards) {
    const cell = CARD * 1.1;
    const limit = CARD / 8;
    for (let pass = 0; pass < 10; pass++) {
      for (let i = 0; i < cards.length; i++) {
        for (let j = i + 1; j < cards.length; j++) {
          const a = cards[i], b = cards[j];
          if (a.pile || b.pile || a.layer !== b.layer) continue;
          const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
          const iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
          const cx = Math.abs((a.x + a.w / 2) - (b.x + b.w / 2));
          const cy = Math.abs((a.y + a.h / 2) - (b.y + b.h / 2));
          let axis = "";
          let gap = 0;
          if (ix > CARD * 0.35 && cy < cell * 1.35 && iy < 0) { axis = "y"; gap = -iy; }
          else if (iy > CARD * 0.35 && cx < cell * 1.35 && ix < 0) { axis = "x"; gap = -ix; }
          if (!axis || gap <= limit) continue;
          const pull = (gap - limit) / 2 + 0.004;
          if (axis === "x") {
            if (a.x < b.x) { a.x += pull; b.x -= pull; }
            else { a.x -= pull; b.x += pull; }
          } else if (a.y < b.y) { a.y += pull; b.y -= pull; }
          else { a.y -= pull; b.y += pull; }
        }
      }
    }
  }

  function positions(level, bump) {
    const def = spec(level);
    const cell = CARD + CARD / 10;
    const grids = [];
    for (const layer of def.layers) {
      const grid = [];
      for (let r = 0; r < layer.r; r++) {
        for (let c = 0; c < layer.c; c++) {
          grid.push({ x: c * cell, y: r * cell, w: CARD, h: CARD, layer: layer.layer, col: c, row: r });
        }
      }
      grids.push(grid);
    }
    const cards = grids.flat();
    nudgeField(cards, level, bump || 0);
    staggerLayers(level, grids, bump || 0);
    tightenGaps(cards);
    for (const card of cards) { delete card.parent; delete card.dx; delete card.dy; delete card.col; delete card.row; card.rot = 0; }
    const plan = stackPlan(level);
    placePiles(cards, level, plan.piles, plan.thick);
    return cards;
  }

  function coverLayers(card, cards) {
    const layers = new Set();
    for (const other of cards) {
      if (other.layer <= card.layer) continue;
      if (overlaps(card, other)) layers.add(other.layer);
    }
    return layers.size;
  }

  function shade(card, cards) {
    const n = coverLayers(card, cards);
    if (n <= 0) return 0;
    if (n === 1) return 0.25;
    if (n === 2) return 0.35;
    if (n === 3) return 0.45;
    return 0.55;
  }

  function pileId(card) {
    if (!card.pile) return null;
    return Math.round((card.x - card.y) * 1000);
  }

  function touches(a, b) {
    const dx = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const dy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (dx > 0.04 && dy > 0.04) return true;
    if (dx > CARD * 0.45 && dy > -CARD / 8 && dy <= 0.04) return true;
    if (dy > CARD * 0.45 && dx > -CARD / 8 && dx <= 0.04) return true;
    return false;
  }

  function buildAdj(cards) {
    const adj = new Map();
    for (const card of cards) adj.set(card, new Set());
    for (let i = 0; i < cards.length; i++) {
      for (let j = i + 1; j < cards.length; j++) {
        const a = cards[i], b = cards[j];
        const pa = pileId(a), pb = pileId(b);
        if (pa !== null && pa === pb) continue;
        if (!touches(a, b)) continue;
        adj.get(a).add(b);
        adj.get(b).add(a);
      }
    }
    return adj;
  }

  function clumpOk(list, adj, mode) {
    if (mode === "strict") {
      for (let i = 0; i < list.length; i++) {
        const near = adj.get(list[i]);
        for (let j = i + 1; j < list.length; j++) if (near.has(list[j])) return false;
      }
      return true;
    }
    const seen = new Set();
    for (const start of list) {
      if (seen.has(start)) continue;
      const stack = [start];
      seen.add(start);
      let size = 0;
      while (stack.length) {
        const cur = stack.pop();
        size += 1;
        if (size > 2) return false;
        for (const other of adj.get(cur)) {
          if (list.includes(other) && !seen.has(other)) {
            seen.add(other);
            stack.push(other);
          }
        }
      }
    }
    return true;
  }

  function buildChunks(cards, rand, maxInitial, adj) {
    const free0 = new Set(freeCards(cards));
    const alive = cards.slice();
    const chunks = [];
    while (alive.length) {
      const chunk = [];
      for (let k = 0; k < 3; k++) {
        const open = freeCards(alive);
        if (!open.length) return null;
        const buried = open.filter((card) => !free0.has(card));
        const ini = open.filter((card) => free0.has(card));
        const used = chunk.filter((card) => free0.has(card)).length;
        let pool;
        if (used >= maxInitial) {
          if (!buried.length) return null;
          pool = buried;
        } else if (ini.length) pool = ini;
        else pool = open;
        const spread = pool.filter((card) => !chunk.some((other) => adj.get(card).has(other)));
        if (spread.length) pool = spread;
        chunk.push(pool[Math.floor(rand() * pool.length)]);
        alive.splice(alive.indexOf(chunk[chunk.length - 1]), 1);
      }
      chunks.push(chunk);
    }
    return chunks;
  }

  function pilesOk(cards) {
    const piles = new Map();
    for (const card of cards) {
      const id = pileId(card);
      if (id === null) continue;
      if (!piles.has(id)) piles.set(id, []);
      piles.get(id).push(card);
    }
    for (const group of piles.values()) {
      const kinds = new Set(group.map((card) => card.type));
      if (kinds.size < 3) return false;
    }
    return true;
  }

  function topSplitOk(cards, adj, level) {
    if (level < 31) return true;
    const free = freeCards(cards);
    for (let i = 0; i < free.length; i++) {
      for (let j = i + 1; j < free.length; j++) {
        if (free[i].type === free[j].type && adj.get(free[i]).has(free[j])) return false;
      }
    }
    return true;
  }

  function pileSizes(cards) {
    const sizes = new Map();
    for (const card of cards) {
      const id = pileId(card);
      if (id === null) continue;
      sizes.set(id, (sizes.get(id) || 0) + 1);
    }
    return sizes;
  }

  function pileRoom(list, sizes) {
    const count = new Map();
    for (const card of list) {
      const id = pileId(card);
      if (id === null) continue;
      count.set(id, (count.get(id) || 0) + 1);
    }
    for (const [id, n] of count) {
      if (n > sizes.get(id) - 2) return false;
    }
    return true;
  }

  function pairGroups(groups, types, adj, rand, mode, level, sizes) {
    const nTypes = types.length;
    const opening = level <= 2;
    const used = new Array(groups.length).fill(false);
    let nodes = 0;

    function search(index, opener) {
      if (index === nTypes) return !opening || opener;
      if (++nodes > 12000) return false;
      let pick = -1;
      let most = -1;
      for (let i = 0; i < groups.length; i++) {
        if (used[i]) continue;
        if (groups[i].free > most) { most = groups[i].free; pick = i; }
      }
      const order = [];
      for (let j = 0; j < groups.length; j++) if (j !== pick && !used[j]) order.push(j);
      shuffle(order, rand);
      order.sort((a, b) => {
        const sa = groups[pick].free + groups[a].free;
        const sb = groups[pick].free + groups[b].free;
        const rank = (sum) => {
          if (opening && !opener) return sum >= 3 ? 0 : 2;
          if (!opening && sum <= 2) return 0;
          return 1;
        };
        return rank(sa) - rank(sb);
      });
      let tries = 0;
      for (const j of order) {
        const sum = groups[pick].free + groups[j].free;
        if (opening) {
          if (!opener && index === nTypes - 1 && sum < 3) continue;
        } else if (sum > 2) continue;
        const six = groups[pick].cards.concat(groups[j].cards);
        if (!clumpOk(six, adj, mode) || !pileRoom(six, sizes)) continue;
        used[pick] = used[j] = true;
        for (const card of six) card.type = types[index];
        if (search(index + 1, opener || sum >= 3)) return true;
        used[pick] = used[j] = false;
        tries += 1;
        if (most === 0 && tries >= 6) break;
      }
      return false;
    }
    return search(0, false);
  }

  function assign(cards, level) {
    const def = spec(level);
    const types = ORDER.slice(0, def.types);
    const adj = buildAdj(cards);
    const freeTotal = freeCards(cards).length;
    const maxInitial = level <= 2 ? 3 : 2;
    for (const mode of ["strict", "pairs"]) {
      for (let attempt = 0; attempt < 40; attempt++) {
        const rand = rng(level * 4409 + 91 + attempt * 131 + (mode === "pairs" ? 7000 : 0));
        const chunks = buildChunks(cards, rand, maxInitial, adj);
        if (!chunks) continue;
        const face = rng(level * 8803 + attempt * 17 + (mode === "pairs" ? 300 : 0));
        const bag = types.slice();
        shuffle(bag, face);
        const groups = chunks.map((chunk) => ({
          cards: chunk,
          free: chunk.filter((card) => !isCovered(card, cards)).length,
        }));
        if (!pairGroups(groups, bag, adj, face, mode, level, pileSizes(cards))) continue;
        if (!pilesOk(cards) || !topSplitOk(cards, adj, level)) continue;
        const freeness = {};
        for (const card of freeCards(cards)) freeness[card.type] = (freeness[card.type] || 0) + 1;
        const counts = Object.values(freeness);
        if (!counts.length) continue;
        if (level <= 2 && !counts.some((n) => n >= 3)) continue;
        if (level >= 3 && counts.some((n) => n >= 3)) continue;
        const solution = [];
        for (const chunk of chunks) for (const card of chunk) solution.push(card.id);
        return solution;
      }
    }
    return null;
  }

  function powersFor(level) {
    return {
      move: level >= 5 ? 3 : 0,
      undo: level >= 8 ? 3 : 0,
      shuffle: level >= 12 ? 3 : 0,
    };
  }

  function hintFor(level) {
    if (level === 5) return "move";
    if (level === 8) return "undo";
    if (level === 12) return "shuffle";
    return null;
  }

  function create(level, seed) {
    let spots = null;
    let solution = null;
    for (let bump = 0; bump < 16; bump++) {
      spots = positions(level, bump);
      spots.forEach((card, i) => { card.id = "c" + (i + 1); });
      solution = assign(spots, level);
      if (solution) break;
    }
    if (!solution) throw new Error("layout cannot be dealt " + level);
    return {
      level,
      cards: spots,
      tray: [],
      hold: [],
      powers: powersFor(level),
      hint: hintFor(level),
      status: "play",
      solution,
      nextId: spots.length + 1,
    };
  }

  function countType(list, type) {
    let n = 0;
    for (const card of list) if (card.type === type) n += 1;
    return n;
  }

  function resolve(state, type) {
    let matched = false;
    if (countType(state.tray, type) >= 3) {
      let removed = 0;
      state.tray = state.tray.filter((card) => {
        if (card.type === type && removed < 3) {
          removed += 1;
          return false;
        }
        return true;
      });
      matched = removed >= 3;
    }
    if (state.tray.length >= 7) state.status = "fail";
    else if (!state.cards.length && !state.tray.length && !state.hold.length) state.status = "win";
    return { status: state.status, matched, type };
  }

  function tap(state, id) {
    if (state.status !== "play") return { ok: false };
    const index = state.cards.findIndex((card) => card.id === id);
    if (index < 0) return { ok: false };
    const card = state.cards[index];
    if (isCovered(card, state.cards)) return { ok: false, reason: "covered" };
    state.cards.splice(index, 1);
    state.tray.push(card);
    const result = resolve(state, card.type);
    return { ok: true, type: card.type, status: result.status, matched: result.matched };
  }

  function takeHold(state, id) {
    if (state.status !== "play") return { ok: false };
    if (state.tray.length >= 7) return { ok: false };
    const index = state.hold.findIndex((card) => card.id === id);
    if (index < 0) return { ok: false };
    const card = state.hold.splice(index, 1)[0];
    state.tray.push(card);
    const result = resolve(state, card.type);
    return { ok: true, type: card.type, status: result.status, matched: result.matched };
  }

  function move(state) {
    if (state.status !== "play" || state.powers.move <= 0) return { ok: false };
    if (state.tray.length < 3 || state.hold.length + 3 > 6) return { ok: false };
    const taken = state.tray.splice(0, 3);
    state.hold.push(...taken);
    state.powers.move -= 1;
    if (state.hint === "move") state.hint = null;
    return { ok: true };
  }

  function undo(state) {
    if (state.status !== "play" || state.powers.undo <= 0 || !state.tray.length) return { ok: false };
    const card = state.tray.pop();
    state.cards.push(card);
    state.powers.undo -= 1;
    if (state.hint === "undo") state.hint = null;
    return { ok: true, id: card.id };
  }

  function mix(state, seed) {
    if (state.status !== "play" || state.powers.shuffle <= 0 || state.cards.length < 2) return { ok: false };
    const rand = rng(seed || 1);
    const types = state.cards.map((card) => card.type);
    const before = types.join();
    shuffle(types, rand);
    if (types.join() === before) {
